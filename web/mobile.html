<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the page can paint under the notch and the home bar,
     which is why mobile.css spends env(safe-area-inset-*) putting content back. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'">
<meta name="theme-color" content="#131314">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sessions">
<!-- The token never rides in a URL after pairing, so referrers have nothing to
     leak; this is belt and braces for the loopback case, where the page itself
     carries the token in a <meta> tag. -->
<meta name="referrer" content="same-origin">
<title>Claude Sessions</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./mobile.css">
</head>
<body>

<!-- Raised when the bridge says this request came from off-machine. Plan 14-C
     asks for it by name: you should never be unsure whether the thing you are
     about to approve is running on a machine you are sitting at. -->
<div id="remote-banner" class="banner" hidden>
  <span class="banner-dot"></span>
  <span id="remote-banner-text">Connected remotely</span>
</div>

<header class="bar">
  <button id="back" class="bar-back" type="button" aria-label="Back" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <h1 id="bar-title" class="bar-title">Needs you</h1>
  <span id="conn" class="conn" data-state="connecting" title="Connection to the bridge"></span>
</header>

<main id="main" class="main">

  <!-- Screen 1: what is blocked on me. The landing screen, because it is the
       reason to pick the phone up at all. -->
  <section id="screen-needs" class="screen" data-screen="needs">
    <div id="needs-list" class="cards"></div>
    <p id="needs-empty" class="empty" hidden>
      <b>Nothing is waiting on you.</b>
      <span id="needs-empty-detail"></span>
    </p>
  </section>

  <!-- Screen 2: every session. -->
  <section id="screen-sessions" class="screen" data-screen="sessions" hidden>
    <label class="filter">
      <input id="filter" type="search" placeholder="Filter sessions" autocomplete="off"
             aria-label="Filter sessions">
    </label>
    <div id="session-list" class="rows"></div>
  </section>

  <!-- Screen 3: one conversation. -->
  <section id="screen-session" class="screen screen-session" data-screen="session" hidden>
    <div id="log" class="log" aria-live="polite"></div>
    <div id="ask-slot" class="ask-slot"></div>
    <form id="composer" class="composer">
      <div class="composer-meta">
        <select id="mode" class="mode" aria-label="Permission mode"></select>
        <span id="queue-note" class="queue-note"></span>
        <button id="stop" class="stop" type="button" hidden>Stop</button>
      </div>
      <div class="composer-row">
        <textarea id="prompt" class="prompt" rows="1" placeholder="Message"
                  aria-label="Message"></textarea>
        <button id="send" class="send" type="submit" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </form>
  </section>

  <!-- Screen 4: start something new. -->
  <section id="screen-new" class="screen" data-screen="new" hidden>
    <form id="new-form" class="new-form">
      <label class="field">
        <span class="field-label">Where</span>
        <select id="new-cwd" class="field-input"></select>
      </label>
      <label class="field">
        <span class="field-label">Mode</span>
        <select id="new-mode" class="field-input"></select>
      </label>
      <label class="field">
        <span class="field-label">First message</span>
        <textarea id="new-prompt" class="field-input field-area" rows="6"
                  placeholder="What should it do?"></textarea>
      </label>
      <label class="check">
        <input id="new-test" type="checkbox">
        <span>Test session — keep it out of the everyday window</span>
      </label>
      <button id="new-go" class="primary" type="submit">Start</button>
      <p id="new-error" class="form-error" hidden></p>
    </form>
  </section>

</main>

<nav class="tabs" aria-label="Sections">
  <button class="tab" data-go="needs" type="button" aria-current="page">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v6m0 3v.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
    </svg>
    <span>Needs you<b id="needs-badge" class="badge" hidden></b></span>
  </button>
  <button class="tab" data-go="sessions" type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2"
            stroke-linecap="round"/>
    </svg>
    <span>Sessions</span>
  </button>
  <button class="tab" data-go="new" type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>New</span>
  </button>
</nav>

<div id="toast" class="toast" hidden></div>

<script type="module" src="./mobile.js"></script>
</body>
</html>
