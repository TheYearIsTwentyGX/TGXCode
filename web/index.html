<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'">
<title>Claude Sessions</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app">

  <header class="bar">
    <span class="wordmark"><b>◆</b> Claude Sessions</span>

    <label class="bar-search">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input id="search" type="search" placeholder="Filter sessions" autocomplete="off"
             aria-label="Filter sessions">
    </label>

    <span class="bar-spacer"></span>

    <button id="db-status" class="db-status" data-up="false" type="button"
            title="DevBrowser connection">
      <span class="led"></span><span id="db-label">DevBrowser</span>
    </button>
  </header>

  <nav class="rail" aria-label="Sessions">
    <div class="rail-head">
      <button id="btn-new" class="btn-new" type="button">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        New session
      </button>
    </div>
    <div id="rail" class="rail-scroll"></div>
  </nav>

  <main class="main">
    <div id="conv" class="conv" hidden>
      <div class="conv-head">
        <button id="btn-back" class="crumb" type="button" hidden>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="btn-back-label">Back</span>
        </button>
        <div class="conv-title-row">
          <h1 id="conv-title" class="conv-title"></h1>
          <div class="conv-actions">
            <button id="btn-pin" class="icon-btn" type="button" title="Pin this session">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 3h6l-.7 5.2 3 2.6V13H6.7v-2.2l3-2.6L9 3Z"
                      stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                <path d="M12 13v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </button>
            <button id="btn-folder" class="icon-btn" type="button"
                    title="Show the working directory in File Explorer">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4L10 7h9.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z"
                      stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              </svg>
            </button>
            <button id="btn-archive" class="icon-btn" type="button" title="Archive this session">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3.5 6.2h17V9h-17V6.2Z" stroke="currentColor" stroke-width="1.7"
                      stroke-linejoin="round"/>
                <path d="M5 9v9.3h14V9" stroke="currentColor" stroke-width="1.7"
                      stroke-linejoin="round"/>
                <path d="M10 12.5h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="conv-sub" class="conv-sub"></div>
        <div id="agents" class="agents" aria-label="Subagents"></div>
        <div id="channels" class="channels"></div>
      </div>

      <div class="conv-body">
        <div id="scroll" class="scroll">
          <div id="log" class="log"></div>
        </div>
        <div id="agent-scroll" class="scroll" hidden>
          <div id="agent-log" class="log"></div>
        </div>
        <nav id="turns" class="turns" aria-label="Your messages in this session"></nav>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <div id="status-line" class="status-line" data-state="idle">
            <span class="led"></span>
            <span id="status-text">Ready</span>
            <button id="btn-stop" class="btn-stop" type="button" hidden>Stop</button>
          </div>

          <div class="input-row">
            <textarea id="input" rows="1" placeholder="Send a message to this session…"
                      aria-label="Message"></textarea>
            <button id="btn-send" class="btn-send" type="button" disabled>Send</button>
          </div>

          <div class="opts">
            <label for="model">Model</label>
            <select id="model" aria-label="Model">
              <option value="">inherit</option>
              <option value="opus">opus</option>
              <option value="sonnet">sonnet</option>
              <option value="haiku">haiku</option>
              <option value="fable">fable</option>
            </select>
            <label for="perm">Permissions</label>
            <select id="perm" aria-label="Permission mode">
              <option value="acceptEdits">acceptEdits</option>
              <option value="auto">auto</option>
              <!-- Worth having now that a prompt is a real question rather than
                   a silent denial: manual asks about everything. -->
              <option value="manual">manual</option>
              <option value="plan">plan</option>
              <option value="dontAsk">dontAsk</option>
              <option value="bypassPermissions">bypassPermissions</option>
            </select>
            <span class="hint">Ctrl+Enter to send</span>
          </div>
        </div>
      </div>
    </div>

    <div id="placeholder" class="empty">
      <h2>No session selected</h2>
      <p>Pick a session from the board, or start a new one. Sessions running in a
         terminal show up here too, and stream as they go.</p>
    </div>
  </main>

</div>

<!-- New session -->
<div id="new-scrim" class="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="new-title">
    <div class="modal-head">
      <span id="new-title">Start a session</span>
      <button class="modal-close" data-close type="button" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="new-cwd">Working directory</label>
        <input id="new-cwd" type="text" spellcheck="false">
        <div class="note">The agent runs here. Recent projects are listed below.</div>
      </div>
      <div class="field">
        <label>Recent projects</label>
        <div id="new-picker" class="picker"></div>
      </div>
      <div class="field">
        <label for="new-prompt">First message</label>
        <textarea id="new-prompt" placeholder="What should this session do?"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <div class="opts" style="margin: 0">
      <label for="new-model">Model</label>
      <select id="new-model">
        <option value="">inherit</option>
        <option value="opus">opus</option>
        <option value="sonnet">sonnet</option>
        <option value="haiku">haiku</option>
        <option value="fable">fable</option>
      </select>
      </div>
      <span class="spacer"></span>
      <button class="btn" data-close type="button">Cancel</button>
      <button id="new-go" class="btn primary" type="button">Start</button>
    </div>
  </div>
</div>

<div id="turn-pop" class="turn-pop" role="tooltip" hidden></div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
